# CRC: crc-Build.md | R199, R302
# Players get GitHub Pages: every push to main builds the page from the sources, stamped with the
# commit's time (as its committer's clock read it), checks it, and publishes it.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build, stamped with the commit's time
        run: HOLLOW_STAMP="$(git log -1 --format=%cd --date=format:'%b %-d %H:%M:%S')" HOLLOW_OUT=site node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

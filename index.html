}

// Begin a tap: spend a Level and pop a card with its glyph under the pointer.
function startTap(handle, cx, cy) {
  const src = handle.classList.contains('box') ? handle : handle.closest('.rent, .line');
  const info = src && resInfo(src);
  if (!info || info.levels < 1) return false;
  const character = src.closest('.card');
  const mat = character && document.getElementById(character.dataset.mat || '');
  const card = makeInfl(info.c, 2, info.name, mat, true);
  card.dataset.res = '1';
  card.dataset.ledger = JSON.stringify({ [rid(src)]: 1 });
  card.dataset.src = rid(src);
  resSpend(src, 1);
  card.style.zIndex = ++zTop;
  card.classList.add('lifted');
  const g = card.querySelector('.cg').getBoundingClientRect(), r = card.getBoundingClientRect();
  const dx = (g.left + g.width / 2 - r.left) / view.z, dy = (g.top + g.height / 2 - r.top) / view.z;
  const p = toWorld(cx, cy);
  card.style.left = (p.x - dx) + 'px'; card.style.top = (p.y - dy) + 'px';
  drag = { obj: card, dx, dy, fresh: true };
  document.body.classList.add('dragging', 'tapping');
  applyVisibility();
  return true;
}
const ledger = card => JSON.parse(card.dataset.ledger || '{}');
// Move one Level between a card and its current source Resource (+1 from it, -1 back to it).
function transfer(card, d) {
  const src = resById(card.dataset.src); if (!src) return;
  const l = ledger(card), id = card.dataset.src;
  if (d > 0 && resInfo(src).levels < 1) return;
  if (d < 0 && !(l[id] > 0)) return;            // only back down to what this source put in
  l[id] = (l[id] || 0) + d;
  resSpend(src, d);
  card.dataset.ledger = JSON.stringify(l);
  const total = Object.values(l).reduce((a, b) => a + b, 0);
  const stack = card.parentElement && card.parentElement.closest('.stack');
  if (total <= 0) { card.remove(); if (stack) settle(stack); return; }   // every Level given back: the tap is undone
  setValue(card, 2 * total);
  card.classList.remove('rolled'); void card.offsetWidth; card.classList.add('rolled');
  card.addEventListener('animationend', () => card.classList.remove('rolled'), { once: true });
  if (stack) settle(stack);
}
function mergeInto(fresh, into) {
  const a = ledger(into), b = ledger(fresh);
  for (const [id, n] of Object.entries(b)) a[id] = (a[id] || 0) + n;
  into.dataset.ledger = JSON.stringify(a);
  into.dataset.src = fresh.dataset.src;
  setValue(into, 2 * Object.values(a).reduce((x, y) => x + y, 0));
  fresh.remove();
  const stack = into.parentElement && into.parentElement.closest('.stack'); if (stack) settle(stack);
}
function refundAll(card) {                       // a tapped card destroyed before use returns its Levels
  for (const [id, n] of Object.entries(ledger(card))) { const src = resById(id); if (src && n) resSpend(src, -n); }
}

/* ---------- players, ownership, secrecy, and gathering ---------- */
/* Who you are vs who you're viewing as. Your real identity comes from your connection (in the
   mockup, `?as=Player%201` stands in for a player's browser; no parameter means the GM). Only a
   real GM gets the "You are" chooser, and keeps it whoever they view as; a player's page is fixed. */
// Who you are: the GM opens the page plain; an invite link (?room=) makes you a player under the name
// this browser remembers (asked once). ?as= overrides both, for testing.
const realMe = (() => {
  const q = new URLSearchParams(location.search);
  if (q.get('as')) return q.get('as');
  if (!q.get('room')) return 'GM';
  let n = null; try { n = localStorage.getItem('glimmer.name'); } catch {}
  while (!n || !n.trim() || n.trim() === 'GM') n = prompt('Your name at the table', n || '') || 'Player';
  n = n.trim().slice(0, 32);
  try { localStorage.setItem('glimmer.name', n); } catch {}
  return n;
})();
if (realMe !== 'GM') {
  const sel = document.getElementById('me');
  if (![...sel.options].some(o => o.value === realMe)) sel.add(new Option(realMe));
  sel.value = realMe;
  sel.closest('.me').hidden = true;
}
const me = () => document.getElementById('me').value;
/* Ownership. A character belongs to the GM (the default for NPCs: only the GM sees it and players
   can't take it), to a player (that player and the GM see it), or is OPEN (everyone sees it, anyone
   may claim it, like a pregen waiting to be picked up). Clicking an open die claims it. Shift-click
   opens your own; the GM can open any, so taking one from a player is open-then-claim. The GM can
   also work any character's roll row without taking it (to aim a PC at a hidden NPC). */
function claim(mat, release) {
  const owner = ownerOf(mat);
  if (release) { if (owner === me() || me() === 'GM') mat.dataset.owner = ''; }
  else if (owner === '') mat.dataset.owner = me();          // only an open character can be claimed
  applyVisibility();
}
function applyVisibility() {
  for (const mat of document.querySelectorAll('.mat')) {
    const owner = ownerOf(mat);
    const mine = me() === 'GM' || owner === me() || owner === '';   // what you may see
    mat.classList.toggle('secret', !mine);
    mat.querySelector('.die-own').textContent = owner === '' ? 'open' : owner.replace('Player ', 'P');
    mat.querySelector('.die-own').title = owner === me() ? 'Click to roll for this character; shift-click to open it for someone else'
      : owner === '' ? 'Open: click to claim this character'
      : me() === 'GM' ? `Click to roll for ${owner}'s character; shift-click to open it (then click to take it)` : 'Belongs to ' + owner;
    if (owner !== me() && me() !== 'GM' && roller.closest('.mat') === mat) undock();
    const card = document.querySelector(`.card[data-mat="${mat.id}"]`);
    if (card) card.classList.toggle('secret', !mine);
    mat.querySelector('.gather').disabled = !card;
    for (const c of document.querySelectorAll(`.infl[data-home="${mat.id}"]`)) {
      c.classList.toggle('secret', !mine);
      c.title = mine ? `${c.dataset.name} ${c.querySelector('.lv').textContent}` : '';
    }
  }
  if (typeof rollReady !== 'undefined' && rollReady) refreshRoll();
}
document.getElementById('me').addEventListener('change', () => { applyVisibility(); saveSeat(); });
// Could this person see that character? (the GM sees all; open characters are public)
const canSee = (who, mat) => who === 'GM' || ownerOf(mat) === who || ownerOf(mat) === '';
// "−5 to −6: Red" → "Red": the dice, not the Difference ("+1" alone reads as a number: "White + 1")
const diceOnly = a => { const d = a.l.split(': ')[1]; return /^[+−]1$/.test(d) ? 'White ' + d[0] + ' 1' : d; };
// A new character's pool pops out above its card, linked, with the card gathered beneath it.
// Whoever makes the character owns it (the GM's characters are unclaimed).
function popPool(card) {
  const mat = makeMat(parseFloat(card.style.left), 0, 'Name');
  mat.dataset.owner = me();
  const visibleTop = toWorld(0, table.getBoundingClientRect().top).y + 10;   // never pop out under the top bar
  mat.style.top = Math.max(visibleTop, parseFloat(card.style.top) - mat.offsetHeight - 14) + 'px';
  card.dataset.mat = mat.id;
  gather(mat);
  mat.classList.add('popped');
  mat.addEventListener('animationend', () => mat.classList.remove('popped'), { once: true });
  applyVisibility();
}
function gather(mat) {
  const card = document.querySelector(`.card[data-mat="${mat.id}"]`); if (!card) return;
  card.style.left = mat.style.left;
  card.style.top = (parseFloat(mat.style.top) + mat.offsetHeight + 14) + 'px';
  card.dataset.gathered = '1';
}
// A gathered card stays snapped under its pool as the drawer grows or shrinks.
const regather = new ResizeObserver(entries => {
  for (const { target: mat } of entries) {
    const card = document.querySelector(`.card[data-mat="${mat.id}"]`);
    if (card && card.dataset.gathered) gather(mat);
  }
});

/* ---------- Boot Hill: graveyards of put-away things ----------
   Putting away a pool or its character card buries both (with everything on them); stickies,
   writing, images, and receipts are buried too. Burials go to the CURRENT graveyard. The Boot
   Hill list shows the current graveyard, with its name and ‹ › at the bottom: › on the last
   graveyard makes a new "Graveyard N" only if this one holds something (or has a name of its own).
   Names are editable. A graveyard that is empty and nameless (a name never changed counts as
   nameless) disappears: when its last item is dragged out, its name erased, or it is left.
   There is always at least one; a new one is numbered one past the highest in use. Dragging a name out brings it back under the pointer. */
// A new graveyard is numbered one past the highest "Graveyard N" in use (never filling a gap
// below it), and flipping › ‹ doesn't count up because the throwaway one is gone by then.
const yards = [];
function newYard() {
  const used = yards.map(y => (y.name.trim().match(/^Graveyard (\d+)$/) || [])[1]).filter(Boolean).map(Number);
  return { name: 'Graveyard ' + (Math.max(0, ...used) + 1), named: false, items: [] };
}
yards.push(newYard());
let cur = 0;
const nameless = y => !y.named || !y.name.trim();
function prune(i) {                         // drop graveyard i if it is empty and nameless; true if dropped
  if (yards.length < 2 || yards[i].items.length || !nameless(yards[i])) return false;
  yards.splice(i, 1);
  if (cur > i || cur >= yards.length) cur = Math.max(0, cur - 1);
  return true;
}
function graveName(el) {
  const first = t => (t || '').trim().split('\n')[0].slice(0, 28) || '…';
  if (el.classList.contains('mat')) return el.querySelector('.who').textContent.trim() || 'Nameless';
  if (el.classList.contains('sticky')) return 'Note: ' + first(el.querySelector('.txt').innerText);
  if (el.classList.contains('text')) return 'Writing: ' + first(el.innerText);
  if (el.classList.contains('receipt')) return first(el.querySelector('.who').textContent);
  if (el.classList.contains('tornroll')) { const n = el.querySelectorAll('.receipt').length; return `Tape: ${n} roll${n === 1 ? '' : 's'}, last ${first(el.querySelector('.receipt .who').textContent)}`; }
  return 'Image';
}
function bury(obj) {
  const mat = obj.classList.contains('mat') ? obj : obj.classList.contains('card') && document.getElementById(obj.dataset.mat || '');
  const card = mat && document.querySelector(`.card[data-mat="${mat.id}"]`);
  const els = mat ? [mat, card].filter(Boolean) : [obj];
  yards[cur].items.push({ els, name: graveName(mat || obj) });
  els.forEach(el => el.remove());
  renderBootHill();
}
// Drag something out: it comes up under the pointer (a character by its pool, its card following
// at the same offset) and the list closes so the table is clear.
function exhume(i, cx, cy) {
  const [g] = yards[cur].items.splice(i, 1);
  prune(cur);
  const lead = g.els[0], ox = parseFloat(lead.style.left) || 0, oy = parseFloat(lead.style.top) || 0;
  const p = toWorld(cx, cy), gx = lead.classList.contains('mat') ? 30 : 20, gy = 14;
  for (const el of g.els) {
    world.appendChild(el); el.style.zIndex = ++zTop;
    el.style.left = (p.x - gx + (parseFloat(el.style.left) || 0) - ox) + 'px';
    el.style.top = (p.y - gy + (parseFloat(el.style.top) || 0) - oy) + 'px';
    if (el.classList.contains('mat')) regather.observe(el);
  }
  applyVisibility();
  renderBootHill();
  graveList.hidden = true;
  lift(lead, cx, cy);
}
function step(d) {
  const leaving = cur;
  if (d < 0) { if (cur === 0) return; cur--; prune(leaving); }
  else if (cur < yards.length - 1) { cur++; if (prune(leaving)) cur = leaving; }
  else if (yards[cur].items.length || !nameless(yards[cur])) { yards.push(newYard()); cur = yards.length - 1; }
  renderBootHill();
}
const bootHill = document.getElementById('boothill'), graveList = document.getElementById('graves');
function renderBootHill() {
  const total = yards.reduce((n, y) => n + y.items.length, 0);
  bootHill.querySelector('.n').textContent = total || '';
  bootHill.classList.toggle('empty', !total);
  const yardLabel = y => y.name.trim() || 'Unnamed graveyard';
  bootHill.querySelector('.to').textContent = '→ ' + yardLabel(yards[cur]);
  const y = yards[cur];
  graveList.innerHTML = '';
  const list = h(`<div class="items"></div>`);
  if (!y.items.length) list.append(h(`<p>Nothing is buried here.</p>`));
  y.items.forEach((g, i) => {
    const b = h(`<button title="Drag this back onto the table. Shift-click twice to delete it forever."></button>`);
    b.textContent = g.name;
    b.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      e.preventDefault();
      if (e.shiftKey) doom(b, `Delete forever? Shift-click again`, () => { yards[cur].items.splice(i, 1); prune(cur); renderBootHill(); });
      else exhume(i, e.clientX, e.clientY);
    });
    list.append(b);
  });
  const nav = h(`<div class="yard"><button class="prev" aria-label="Previous graveyard">‹</button>
    <input class="yname" aria-label="Graveyard name" spellcheck="false" title="Rename this graveyard. Shift-click twice to delete everything in it."><button class="next" aria-label="Next graveyard">›</button></div>`);
  const input = nav.querySelector('.yname');
  input.value = y.name; input.placeholder = 'Unnamed graveyard';
  nav.querySelector('.prev').disabled = cur === 0;
  nav.querySelector('.prev').addEventListener('click', () => step(-1));
  nav.querySelector('.next').addEventListener('click', () => step(1));
  input.addEventListener('pointerdown', e => {
    if (!e.shiftKey || !y.items.length) return;
    e.preventDefault();
    doom(input, '', () => { y.items = []; prune(cur); renderBootHill(); }, `Delete everything here? Shift-click again`);
  });
  input.addEventListener('input', () => { y.name = input.value; y.named = true; saveSoon(); bootHill.querySelector('.to').textContent = '→ ' + yardLabel(y); });
  input.addEventListener('change', () => { if (prune(cur)) renderBootHill(); });
  graveList.append(nav, list);
  saveSoon(); saveSeat();
}
bootHill.addEventListener('click', () => { renderBootHill(); graveList.hidden = !graveList.hidden; saveSeat(); });
/* Deleting forever is the one thing that can't be undone, so it takes two shift-clicks: the first
   arms (the item turns red and says so), the second within 3 s destroys; otherwise it reverts. */
let doomed = null;
function doom(el, label, destroy, placeholder) {
  if (doomed && doomed.el === el) { clearTimeout(doomed.t); doomed = null; destroy(); return; }
  if (doomed) doomed.undo();
  const was = el.tagName === 'INPUT' ? el.value : el.textContent;
  el.classList.add('doom');
  if (el.tagName === 'INPUT') { el.dataset.was = was; el.value = placeholder; el.readOnly = true; } else el.textContent = label;
  const undo = () => { el.classList.remove('doom'); if (el.tagName === 'INPUT') { el.value = was; el.readOnly = false; } else el.textContent = was; };
  doomed = { el, undo, t: setTimeout(() => { undo(); doomed = null; }, 3000) };
}
renderBootHill();

/* ---------- the paper tape ----------
   Every roll prints onto a tape that comes out of the register's slot and hangs over the table,
   newest at the top; about three show and the rest scroll. The paper roll at the register's right
   end rolls it up to a sliver and back. The tape lies UNDER pools and cards; a new roll or a press
   raises it over them, and pressing anything else lowers it again (like windows on a desktop).
   Dragging it tears off the whole roll onto the table (drop that on the bar to bury it). */
const tape = document.getElementById('tape'), strip = tape.querySelector('.strip');
function placeTape() { const r = document.querySelector('.register').getBoundingClientRect(); tape.style.left = Math.max(8, Math.min(r.left + 2, innerWidth - 258)) + 'px'; }   // stays in the window
function printTape(el) {
  strip.prepend(el);
  tape.classList.remove('empty', 'up');
  tape.classList.add('raised');            // something new: bring it up to read
  strip.scrollTop = 0;
  el.classList.add('printing');
  el.addEventListener('animationend', () => el.classList.remove('printing'), { once: true });
  placeTape();
}
function tidyTape() { tape.classList.toggle('empty', !strip.querySelector('.receipt')); }
document.getElementById('paperroll').addEventListener('click', () => { tape.classList.toggle('up'); saveSeat(); });
// Pressing anything else on the table lowers the tape back under your pools and cards.
document.addEventListener('pointerdown', e => { if (!e.target.closest('#tape, #paperroll, #roll')) tape.classList.remove('raised'); }, true);
document.getElementById('paperroll').addEventListener('click', () => { if (!tape.classList.contains('up')) tape.classList.add('raised'); });
// Dragging anywhere on the tape tears off the WHOLE roll as one strip; the next roll starts a fresh tape.
let tapePress = null;
strip.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !strip.querySelector('.receipt')) return;
  e.stopPropagation();                     // the tape is on the table: don't start a pan
  if (e.target.closest('[contenteditable]') && e.target.closest('[contenteditable]') === document.activeElement) return;
  e.preventDefault();
  tape.classList.add('raised');
  tapePress = { x: e.clientX, y: e.clientY };
});
addEventListener('pointermove', e => {
  if (!tapePress || Math.hypot(e.clientX - tapePress.x, e.clientY - tapePress.y) < 5) return;
  tapePress = null;
  tearRoll(e);
});
addEventListener('pointerup', () => { tapePress = null; });
strip.addEventListener('wheel', e => e.stopPropagation());   // scroll the tape, don't zoom the table
function tearRoll(e) {
  const rect = strip.getBoundingClientRect(), p = toWorld(e.clientX, e.clientY);
  const dx = (e.clientX - rect.left) / view.z, dy = (e.clientY - rect.top) / view.z;
  const roll = h(`<div class="tornroll"><div class="rolls"></div></div>`);
  strip.querySelectorAll('.receipt').forEach(r => { r.classList.remove('printing'); roll.firstChild.appendChild(r); });
  roll.classList.add('obj'); roll.style.setProperty('--tilt', tilt());
  roll.style.left = (p.x - dx) + 'px'; roll.style.top = (p.y - dy) + 'px';
  world.appendChild(roll);
  tidyTape();
  tape.classList.remove('raised');
  lift(roll, e.clientX, e.clientY);
}
// A torn roll scrolls inside; the wheel scrolls it rather than zooming the table while it can.
table.addEventListener('wheel', e => {
  const r = e.target.closest('.tornroll .rolls'); if (!r) return;
  const canScroll = e.deltaY < 0 ? r.scrollTop > 0 : r.scrollTop + r.clientHeight < r.scrollHeight - 1;
  if (canScroll) e.stopImmediatePropagation();
}, { capture: true });
addEventListener('resize', placeTape);
document.fonts && document.fonts.ready.then(placeTape);

/* ---------- dice (Hollow Folks: Difference → Dice, resolve, explode) ---------- */
const ADV = [
  { l: '+10 or more: Outclass', auto: 'success' },
  { l: '+7 to +9: Green + 1', d: 'G', m: 1 },
  { l: '+5 to +6: Green', d: 'G' },
  { l: '+3 to +4: +1', m: 1 },
  { l: '−2 to +2: White' },
  { l: '−3 to −4: −1', m: -1 },
  { l: '−5 to −6: Red', d: 'R' },
  { l: '−7 to −9: Red − 1', d: 'R', m: -1 },
  { l: '−10 or less: Outclassed', auto: 'fail' },
];
/* The roll row: the dice you are about to roll, docked on the pool you are rolling for (your own
   view only). White carries the Advantage row: click for more advantage, shift-click for less,
   walking the Difference table (a Green or Red die appears, ±1 shows, Outclass is written out).
   Blue is always rolled. Yellows: click adds one, shift-click removes one. The bonus: click raises,
   shift-click lowers. The dice are blank; the receipt on the table records the numbers. */
const roller = document.getElementById('roller'), rollhome = document.getElementById('rollhome');
const rollinfo = document.getElementById('rollinfo');   // the action and opponent, shown in the docked pool's header
/* With an action chosen, the roll row is live: Yellows and bonus come from the action plus the
   character's Bonus pool, recomputed whenever a pool changes. A pool's value is its best positive
   minus its worst negative (after Roll Up). With an empty Bonus pool the card is taken as written
   (`2d+3` stays 2 Yellows +3); once the pool adds points, the bonus total regroups by Hollow Folks'
   rule: a Yellow per 3 full points, the rest added; a negative total adds no dice. Hand edits to
   the Yellows and bonus are kept as an adjustment on top, until the next action is chosen. */
let act = null, adj = { y: 0, b: 0 };
function poolValue(mat, pool) {
  const slot = mat.querySelector(`.slot[data-pool="${pool}"]`); if (!slot) return 0;
  const worth = u => u.classList.contains('odd') ? 1 : +u.dataset.v + (rider(u) ? 1 : 0);
  const best = st => Math.max(0, ...[...slot.querySelector(st).children].map(worth));
  return best('.pos') - best('.neg');
}
/* What a roll would be for this character with this action, from THIS page's records: the Yellows and
   bonus (the action's, the Bonus pool's, and the hand adjustment), the Total Influence, and against an
   opponent their total and the Difference. The roll row shows it; the GM's page resolves players'
   intents with it, so a player's numbers never have to travel. */
function rowSpec(mat, a, adj = { y: 0, b: 0 }) {
  const P = poolValue(mat, 'Bonus');
  let y = a.y, b = a.b;
  if (P) { const t = b + P; if (t >= 0) { y += Math.floor(t / 3); b = t % 3; } else b = t; }
  // Total Influence = Base + Main + Edge + Bias pools (Bill, 11-09). Stagger counts only when this
  // character is the opposition.
  const parts = { Main: poolValue(mat, 'Main'), Edge: poolValue(mat, 'Edge'), Bias: poolValue(mat, 'Bias') };
  const total = a.base + parts.Main + parts.Edge + parts.Bias;
  let opp = null;
  const el = a.vs && document.getElementById(a.vs.mat);
  if (el) {
    const def = defendOf(document.querySelector(`.card[data-mat="${el.id}"]`))[a.vs.kind] ?? 0;
    const oppTotal = def + ['Main', 'Edge', 'Bias', 'Stagger'].reduce((n, k) => n + poolValue(el, k), 0);
    opp = { el, def, oppTotal, diff: total - oppTotal };
  }
  return { P, parts, total, opp, y: Math.max(0, Math.min(9, y + adj.y)), b: Math.max(-9, Math.min(9, b + adj.b)) };
}
function refreshRoll() {
  const mat = roller.closest('.mat');
  document.querySelectorAll('.mat.targeted').forEach(m => m.classList.remove('targeted'));
  const target = act && act.vs && mat && document.getElementById(act.vs.mat);
  if (target) target.classList.add('targeted');
  markAction();
  roller.classList.remove('lockrow');
  if (!act || !mat) { delete roller.dataset.label; delete roller.dataset.base; delete roller.dataset.total; delete roller.dataset.vs;
    rollinfo.querySelector('.base').title = ''; rollinfo.querySelector('.vs').innerHTML = ''; return renderRoller(); }
  if (act.vs && !document.getElementById(act.vs.mat)) delete act.vs;
  const sp = rowSpec(mat, act, adj), P = sp.P, parts = sp.parts, total = sp.total;
  steps.y = sp.y; steps.b = sp.b;
  roller.dataset.label = act.label; roller.dataset.base = act.base; roller.dataset.total = total;
  const vs = rollinfo.querySelector('.vs');
  vs.innerHTML = ''; delete roller.dataset.vs;
  const opp = sp.opp && sp.opp.el;
  if (opp) {
    const { def, oppTotal, diff } = sp.opp;
    // The row is the rolling character's: it shows only what that character's owner may know, even on
    // the GM's screen (the player is watching). The row is still picked by whoever can see the opponent.
    const viewerSees = !opp.classList.contains('secret'), hidden = !canSee(ownerOf(mat), opp);
    roller.classList.toggle('lockrow', !viewerSees);   // a player can't re-pick what the GM set
    if (viewerSees && !act.advManual) advI = rowFor(diff);
    vs.innerHTML = hidden ? `vs ${act.vs.name}` : `vs ${act.vs.name}<b>${oppTotal} (${diff >= 0 ? '+' : ''}${diff})</b>`;
    vs.title = hidden ? `Only the GM knows ${act.vs.name}'s numbers. Click to stop aiming.`
      : `${act.vs.name}: ${act.vs.kind && act.vs.kind !== 'any' ? act.vs.kind + ' ' : ''}Defend ${def}, plus Main, Edge, Bias and Stagger = ${oppTotal}. Difference ${diff}. Click to stop aiming.`;
    roller.dataset.vs = hidden ? `vs ${act.vs.name}` : `vs ${act.vs.name} (${act.vs.kind && act.vs.kind !== 'any' ? act.vs.kind + ' ' : ''}${oppTotal}), Difference ${diff >= 0 ? '+' : ''}${diff}`;
  }

// The dice, given the Difference row, the Yellows, and the bonus.
function rollDice(row, ys, bn) {

function applyPieces(puts, dels) {

async function openGame(id) {

  thaw(Object.fromEntries(recs.map(r => [r.rid, r])));
  game = id; if (!id.startsWith('m-')) lsSet('glimmer.game', id);   // a player's copy is never the GM's game
  restoreSeat();
  saved = new Map(recs.map(r => [r.rid, JSON.stringify(r)]));
  await new Promise(r => setTimeout(r));                // let the observer's records from thawing drain
  muted = false;
  writeSeat();
  await flush();                                        // thawing may normalize a record or two
  renderLedger();
}

  await flush();
  const at = Date.now();
  await idb.run(['games', 'records'], s => {
    s('games').put({ id, name, created: at, updated: at });
    if (recs) Object.values(recs).forEach(r => s('records').put(r, [id, r.rid]));

}
async function checkpoint(name, auto = false) {

  await flush();
  const records = Object.fromEntries([...saved].map(([rid, s]) => [rid, JSON.parse(s)]));
  await idb.run(['checkpoints'], s => s('checkpoints').add({ game, name, at: Date.now(), auto, records }));
  const autos = (await idb.byGame('checkpoints', game)).filter(c => c.auto).sort((a, b) => b.at - a.at);
  if (autos.length > 20) await idb.run(['checkpoints'], s => autos.slice(20).forEach(c => s('checkpoints').delete(c.id)));
  renderLedger();
}

async function restoreCheckpoint(id) {
  const cp = await idb.get('checkpoints', id);
  if (!cp) return;
  const undoing = cp.name.match(/^Before (?:restoring|undoing) “(.*)”$/);   // don't nest the names
  await checkpoint(undoing ? `Before undoing “${undoing[1]}”` : `Before restoring “${cp.name}”`, true);
  writeSeat();
  muted = true;
  thaw(cp.records);
  restoreSeat();                                        // your seat survives a restore
  await new Promise(r => setTimeout(r));
  muted = false;
  await flush();
  renderLedger();
}

  const meta = await idb.get('games', game);
  const records = Object.fromEntries([...saved].map(([rid, s]) => [rid, JSON.parse(s)]));
  const checkpoints = (await idb.byGame('checkpoints', game)).sort((a, b) => a.at - b.at)
    .map(({ name, at, auto, records }) => ({ name, at, auto, records }));
  const hashes = new Set(JSON.stringify([records, checkpoints]).match(/data-blob=\\"[0-9a-f]{64}/g)?.map(s => s.slice(-64)) || []);
  const blobs = {};
  for (const hash of hashes) { const b = await idb.get('blobs', hash); if (b) blobs[hash] = await toDataUrl(b); }
  const file = { format: 'glimmer-game', version: 1, name: meta.name, exported: new Date().toISOString(), records, checkpoints, blobs };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(file, null, 1)], { type: 'application/json' }));
  a.download = (meta.name.trim().replace(/[^\w-]+/g, '-').replace(/^-|-$/g, '') || 'game') + '.glimmer.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// An import always becomes a new game beside the others; it never overwrites one.
async function importGame(f) {
  let file;
  try { file = JSON.parse(await f.text()); } catch { return ledgerStatus('Not a game file: ' + f.name); }
  if (file?.format !== 'glimmer-game' || file.version !== 1 || typeof file.records !== 'object') return ledgerStatus('Not a game file: ' + f.name);
  const blobs = await Promise.all(Object.entries(file.blobs || {}).map(async ([hash, url]) => [hash, await (await fetch(url)).blob()]));
  await idb.run(['blobs'], s => blobs.forEach(([hash, b]) => s('blobs').put(b, hash)));
  let name = String(file.name || f.name);
  if ((await idb.all('games')).some(g => g.name === name)) name += ' (imported)';   // tell the two apart in the list
  const id = await createGame(name);
  await idb.run(['checkpoints'], s => (file.checkpoints || []).forEach(c =>
    s('checkpoints').add({ game: id, name: c.name, at: c.at, auto: !!c.auto, records: c.records })));
  await idb.run(['records'], s => Object.values(file.records).forEach(r => s('records').put(r, [id, r.rid])));
  await openGame(id);
}

/* The ledgerEl: the game's name, its checkpoints, and the other games. */
const ledgerEl = document.getElementById('ledger'), ledgerBtn = document.getElementById('ledgerbtn');
let ledgerMsg = '';
function ledgerStatus(s) { ledgerMsg = s; const el = ledgerEl.querySelector('.status'); if (el) el.textContent = s; }
const stampOf = at => { const d = new Date(at); return d.toLocaleString('en-US', { month: 'short', day: 'numeric' }) + ', ' + clock(d); };
async function renderLedger() {
  if (ledgerEl.hidden) return;
  if (!idb.ready) { ledgerEl.innerHTML = '<p class="status">Not saving: this browser refused local storage.</p>'; return; }
  const games = (await idb.all('games')).filter(g => g.id === game || !g.id.startsWith('m-')).sort((a, b) => b.updated - a.updated);
  const meta = games.find(g => g.id === game);
  const cps = (await idb.byGame('checkpoints', game)).sort((a, b) => b.at - a.at);
  ledgerEl.innerHTML = `<input class="gname" aria-label="Game name" spellcheck="false">
    <div class="acts"><button class="cp" title="Save a named copy of the table as it is now">Checkpoint</button>
      <button class="ex" title="Download this game, with its checkpoints and images, as one file">Export</button>
      <button class="im" title="Open a game file as a new game">Import</button>
      <button class="nw" title="Start a new, empty table">New game</button></div>
    <p class="status"></p>
    <h4>Checkpoints</h4><div class="cps"></div>
    <h4>Games</h4><div class="games"></div>
    <input type="file" accept=".json,application/json" hidden>`;
  const name = ledgerEl.querySelector('.gname');
  name.value = meta ? meta.name : '';
  name.addEventListener('change', async () => {
    const m = await idb.get('games', game);
    await idb.run(['games'], s => s('games').put({ ...m, name: name.value.trim() || 'Untitled game' }));
    renderLedger();
  });
  ledgerStatus(ledgerMsg);
  const list = ledgerEl.querySelector('.cps');
  if (!cps.length) list.append(h(`<p>None yet. End makes one at the end of every conflict.</p>`));
  for (const c of cps) {
    const b = h(`<button title="Restore the table to this checkpoint. The table as it stands is checkpointed first, so this can be undone."><span></span><time></time></button>`);
    b.querySelector('span').textContent = c.name; b.querySelector('time').textContent = stampOf(c.at);
    if (c.auto) b.classList.add('auto');
    b.addEventListener('click', () => restoreCheckpoint(c.id));
    list.append(b);
  }
  const gl = ledgerEl.querySelector('.games');
  for (const g of games) {
    const b = h(`<button><span></span><time></time></button>`);
    b.querySelector('span').textContent = g.name; b.querySelector('time').textContent = stampOf(g.updated);
    if (g.id === game) { b.classList.add('current'); b.disabled = true; b.title = 'The game on the table'; }
    else { b.title = 'Put this game on the table (this one is saved as it is)'; b.addEventListener('click', () => openGame(g.id)); }
    gl.append(b);
  }
  const picker = ledgerEl.querySelector('input[type=file]');
  ledgerEl.querySelector('.cp').addEventListener('click', () => {
    const n = prompt('Name this checkpoint', 'Round ' + round + ', ' + clock(new Date()));
    if (n !== null) checkpoint(n.trim() || 'Checkpoint');
  });
  ledgerEl.querySelector('.ex').addEventListener('click', exportGame);
  ledgerEl.querySelector('.im').addEventListener('click', () => picker.click());
  picker.addEventListener('change', () => { if (picker.files[0]) importGame(picker.files[0]); });
  ledgerEl.querySelector('.nw').addEventListener('click', async () => openGame(await createGame('New game ' + stampOf(Date.now()))));
  if (mirrorOf) {                                       // the GM's page holds the game; this is a copy
    ledgerEl.querySelectorAll('.cp, .im, .nw, .cps, .games, h4').forEach(x => x.remove());
    name.readOnly = true;
    ledgerEl.querySelector('.status').before(h(`<p class="copy">The GM's page holds this game. This browser keeps a copy so a reload shows the table at once; the GM checkpoints and restores.</p>`));
  }
}
ledgerBtn.addEventListener('click', () => { ledgerEl.hidden = !ledgerEl.hidden; renderLedger(); });
document.addEventListener('pointerdown', e => { if (!ledgerEl.hidden && !e.target.closest('#ledger, #ledgerbtn')) ledgerEl.hidden = true; });

/* Boot: reopen the last game, or set out the 11-08 playtest as the first one. A player's page opens
   its copy of the GM's table instead, empty until the GM's page sends it. */
const mirrorOf = (() => { const r = new URLSearchParams(location.search).get('room');
  return realMe !== 'GM' && r && /^[\w-]{8,80}$/.test(r) ? r : null; })();
function freshTable() {
  scene();
  document.querySelectorAll('.card .col').forEach(c => { decorateResources(c); decorateActions(c); });
  document.querySelectorAll('.mat').forEach(gather);
  applyVisibility();
  document.querySelectorAll('.mat').forEach(renderUsed);
}
async function boot() {
  try { await idb.open(); } catch { freshTable(); return; }   // no storage: play, unsaved (the ledgerEl says so)
  if (mirrorOf) {                                      // a player: this room's copy of the GM's table
    const id = 'm-' + mirrorOf;
    if (!(await idb.get('games', id))) await createGame("The GM's table", null, id);
    await openGame(id); return;
  }
  let id = lsGet('glimmer.game');
  if (!id || !(await idb.get('games', id))) id = (await idb.all('games')).filter(g => !g.id.startsWith('m-')).sort((a, b) => b.updated - a.updated)[0]?.id;
  if (id) { await openGame(id); return; }
  freshTable();
  game = await createGame('The 11-08 playtest'); lsSet('glimmer.game', game);
  await flush();
}

boot();
fit();
window.addEventListener('resize', fit);
</script>
